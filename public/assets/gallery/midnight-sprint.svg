<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1724"/>
      <stop offset="50%" stop-color="#080d15"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad3)"/>
  <rect width="800" height="500" rx="16" fill="url(#glow3)"/>
  <rect x="2" y="2" width="796" height="496" rx="15" fill="none" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#00D2FF" fill-opacity="0.15" stroke="#00D2FF" stroke-width="1.5"/>
    <text x="95" y="22" fill="#00D2FF" font-family="Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" text-anchor="middle">MIDNIGHT SPRINT • 03:00 AM</text>
  </g>

  <!-- Midnight coding session graphic -->
  <g transform="translate(60, 110)">
    <rect x="150" y="20" width="380" height="170" rx="14" fill="#09121f" stroke="#00D2FF" stroke-width="2"/>
    
    <!-- Code terminal -->
    <rect x="170" y="45" width="340" height="120" rx="8" fill="#03070e"/>
    <text x="190" y="75" fill="#4CAF50" font-family="monospace" font-size="14">&gt; npm run deploy:live</text>
    <text x="190" y="100" fill="#00D2FF" font-family="monospace" font-size="14">&gt; [OK] 24H build completed at 03:42 AM</text>
    <text x="190" y="125" fill="#FF8800" font-family="monospace" font-size="14">&gt; 120 commits pushed to main</text>
    <text x="190" y="150" fill="#FFFFFF" font-family="monospace" font-size="13">Pizza &amp; Midnight Red Bull fuel powering teams</text>
  </g>

  <!-- Description -->
  <g transform="translate(60, 390)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="28">Midnight Debugging &amp; Code Marathon</text>
    <text x="0" y="30" fill="#A0A5BA" font-family="Arial, sans-serif" font-size="16">Intense 03:00 AM adrenaline rush as engineers pushed critical bug fixes and final builds.</text>
    <text x="0" y="60" fill="#00D2FF" font-family="Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1">NON-STOP 24H ENERGY • MIDNIGHT SNACKS • REAL LIVE BUILDS</text>
  </g>
</svg>
