<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181224"/>
      <stop offset="50%" stop-color="#0e0a16"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B388FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <radialGradient id="glow6" cx="60%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad6)"/>
  <rect width="800" height="500" rx="16" fill="url(#glow6)"/>
  <rect x="2" y="2" width="796" height="496" rx="15" fill="none" stroke="#B388FF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#B388FF" fill-opacity="0.18" stroke="#B388FF" stroke-width="1.5"/>
    <text x="110" y="22" fill="#B388FF" font-family="Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" text-anchor="middle">COMMUNITY &amp; MENTORS</text>
  </g>

  <!-- Community graphic -->
  <g transform="translate(60, 110)">
    <rect x="160" y="20" width="360" height="170" rx="14" fill="#130e1e" stroke="#B388FF" stroke-width="2"/>
    
    <circle cx="280" cy="80" r="28" fill="#7C4DFF" fill-opacity="0.4" stroke="#B388FF" stroke-width="2"/>
    <circle cx="400" cy="80" r="28" fill="#FF8800" fill-opacity="0.4" stroke="#FF8800" stroke-width="2"/>
    <path d="M308 80 L372 80" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,4"/>
    
    <text x="340" y="140" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="20" text-anchor="middle">SLIET TECH COMMUNITY</text>
    <text x="340" y="165" fill="#B388FF" font-family="Arial, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Organized Exclusively By Internwell</text>
  </g>

  <!-- Description -->
  <g transform="translate(60, 390)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="28">SLIET Developer Community Hub</text>
    <text x="0" y="30" fill="#A0A5BA" font-family="Arial, sans-serif" font-size="16">Fostering peer collaboration, open-source building, and engineering camaraderie on campus.</text>
    <text x="0" y="60" fill="#B388FF" font-family="Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1">INTERNWELL SLIET • 1-ON-1 SESSIONS • NETWORKING</text>
  </g>
</svg>
