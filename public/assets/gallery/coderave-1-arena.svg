<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="50%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FA002D"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad1)"/>
  <rect width="800" height="500" rx="16" fill="url(#glow1)"/>
  <rect x="2" y="2" width="796" height="496" rx="15" fill="none" stroke="#FF8800" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Arena Illustration Graphic -->
  <g transform="translate(40, 50)">
    <circle cx="50" cy="50" r="44" fill="#1f212d" stroke="url(#neonOrange)" stroke-width="3"/>
    <path d="M35 50 L45 60 L65 40" fill="none" stroke="#FF8800" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Camera Photo Icon Badge -->
    <rect x="115" y="28" width="180" height="34" rx="17" fill="#FF8800" fill-opacity="0.18" stroke="#FF8800" stroke-width="1.5"/>
    <text x="205" y="50" fill="#FF8800" font-family="Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" text-anchor="middle">EVENT PHOTO • 2024</text>
  </g>

  <!-- Laptop / Desk Arena Nodes -->
  <g transform="translate(60, 160)">
    <!-- Stage Display -->
    <rect x="240" y="20" width="200" height="90" rx="12" fill="#14161f" stroke="#FF8800" stroke-width="2"/>
    <text x="340" y="58" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="20" text-anchor="middle">CODERAVE 1.0</text>
    <text x="340" y="82" fill="#FF8800" font-family="Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2" text-anchor="middle">24H LIVE ARENA</text>

    <!-- Hackers desks -->
    <rect x="40" y="140" width="140" height="30" rx="6" fill="#1e202c" stroke="#333644"/>
    <rect x="80" y="115" width="60" height="25" rx="4" fill="#000" stroke="#FF8800" stroke-width="1.5"/>

    <rect x="270" y="140" width="140" height="30" rx="6" fill="#1e202c" stroke="#333644"/>
    <rect x="310" y="115" width="60" height="25" rx="4" fill="#000" stroke="#FF8800" stroke-width="1.5"/>

    <rect x="500" y="140" width="140" height="30" rx="6" fill="#1e202c" stroke="#333644"/>
    <rect x="540" y="115" width="60" height="25" rx="4" fill="#000" stroke="#FF8800" stroke-width="1.5"/>
  </g>

  <!-- Text Details -->
  <g transform="translate(60, 390)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="28">CodeRave 1.0 — 24H Live Sprint Arena</text>
    <text x="0" y="30" fill="#A0A5BA" font-family="Arial, sans-serif" font-size="16">Over 500+ student developers gathered at SLIET for non-stop prototype building.</text>
    <text x="0" y="60" fill="#FF8800" font-family="Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1">500+ HACKERS • 120 TEAMS • AUDITORIUM ARENA</text>
  </g>
</svg>
