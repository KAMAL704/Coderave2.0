  </g>
  <!-- Front face -->
  <g filter="url(#shadow-V)">
    <path d="M 35 40 L 95 240 L 140 240 L 200 40 L 150 40 L 115 175 L 85 40 Z" fill="#54A0FF" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
